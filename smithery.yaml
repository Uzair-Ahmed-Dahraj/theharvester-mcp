name: theharvester-mcp
description: OSINT email and subdomain discovery for AI agents, powered by theHarvester. Multi-arch Docker.
vendor: Devkind
homepage: https://devkind.com.au/services
license: MIT
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      timeout:
        type: number
        description: Per-harvest timeout in seconds
        default: 120
      maxConcurrent:
        type: number
        description: Maximum concurrent harvests
        default: 2
  commandFunction: |-
    (config) => ({
      command: "docker",
      args: ["run", "--rm", "-i", "-e", `THEHARVESTER_TIMEOUT=${config.timeout ?? 120}`, "-e", `THEHARVESTER_MAX_CONCURRENT=${config.maxConcurrent ?? 2}`, "devkind/theharvester-mcp"]
    })
